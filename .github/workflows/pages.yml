name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compute card image cache key
        id: card-image-cache
        run: echo "key=$(npm run --silent import -- --cache-key)" >> "$GITHUB_OUTPUT"

      - name: Restore card image cache
        uses: actions/cache@v6
        with:
          path: public/cards
          key: card-images-v1-${{ steps.card-image-cache.outputs.key }}
          restore-keys: card-images-v1-

      - name: Restore catalog metadata cache
        uses: actions/cache@v6
        with:
          path: public/data/cards.json
          key: card-catalog-v1-${{ steps.card-image-cache.outputs.key }}
          restore-keys: card-catalog-v1-

      - name: Import catalog
        run: npm run import

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
